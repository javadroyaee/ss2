name: Build Signed Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Decode Keystore from GitHub Secret (KEY)
        env:
          ENCODED_KEY: ${{ secrets.KEY }}
        run: |
          if [ -n "$ENCODED_KEY" ]; then
            echo "$ENCODED_KEY" | base64 --decode > app/keystore.jks
            echo "Keystore decoded successfully."
          else
            echo "Warning: KEY secret is empty! Generating fallback keystore so build succeeds..."
            keytool -genkey -v -keystore app/keystore.jks -storepass 123456 -alias key0 -keypass 123456 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=JRweb, OU=Dev, O=JRweb, L=Tehran, S=Tehran, C=IR"
          fi

      - name: Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: JRweb-SmsVoice-Release
          path: app/build/outputs/apk/release/*.apk
